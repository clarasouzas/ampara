{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AMPARA{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS do projeto -->
    <link
        rel="stylesheet"
        href="{% static 'ampara/css/style.css' %}"
    >

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-ampara">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand navbar-brand-ampara" href="/">
                <img
                    src="{% static 'ampara/img/logo.svg' %}"
                    alt="AMPARA - Meninas de Luta"
                    class="logo-ampara"
                >
            </a>

            <!-- Botão mobile -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarPrincipal"
                aria-controls="navbarPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div
                class="collapse navbar-collapse"
                id="navbarPrincipal"
            >

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Sobre
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Funcionalidades
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Projetos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Utilidade pública
                        </a>
                    </li>

                </ul>

                <!-- Botões -->
                <div class="d-flex gap-2">

                    <a href="#" class="btn btn-entrar">
                        Entrar
                    </a>

                    <a href="#" class="btn btn-criar">
                        Criar conta
                    </a>

                </div>

            </div>

        </div>
    </nav>


    {% block content %}
    {% endblock %}


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
